name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
      - name: Pruebas
        run: npm test
      - name: Auditoría de dependencias (producción)
        # Excepción temporal: GHSA-ch52-4w7c-c8xp (http-cache-semantics, sin parche upstream).
        # Quitar el --allowlist cuando exista versión corregida.
        run: npx --yes audit-ci@7.1.0 --high --skip-dev --allowlist GHSA-ch52-4w7c-c8xp
